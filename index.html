<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cochileña - Pago</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #222;
      text-align: center;
    }

    .container {
      padding: 20px;
      max-width: 500px;
      margin: auto;
    }

    .logo {
      width: 200px;
      margin-bottom: 10px;
    }

    h1 {
      color: #8b4513;
      margin: 5px 0;
    }

    .subtitle {
      font-size: 14px;
      margin-bottom: 20px;
      color: #555;
    }

    .card {
      border: 1px solid #d4af37;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
      background: #fff;
    }

    .bank {
      font-weight: bold;
      color: #8b4513;
      margin-bottom: 5px;
    }

    .number {
      font-size: 18px;
      font-weight: bold;
      margin: 10px 0;
      word-break: break-all;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      background: #d4af37;
      color: black;
    }

    .whatsapp {
      background: #25D366;
      color: white;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<div class="container">

<img src="logo-cochilena.jpg" class="logo">

<h1>Cochileña</h1>
<div class="subtitle">Toca un botón para copiar</div>

<!-- Banco Azteca -->
<div class="card">
  <div class="bank">Banco Azteca</div>
  <div class="number" id="card1">4027665889581485</div>
  <button onclick="copy('card1', this)">Copiar tarjeta</button>
</div>

<!-- BBVA -->
<div class="card">
  <div class="bank">BBVA</div>
  <div class="number" id="card2">4152314320672226</div>
  <button onclick="copy('card2', this)">Copiar tarjeta</button>
</div>

<button class="whatsapp" onclick="sendWhats()">Enviar comprobante por WhatsApp</button>

</div>

<script>
function copy(id, btn){
  const text = document.getElementById(id).innerText;
  navigator.clipboard.writeText(text);

  btn.innerText = "✔ Copiado";
  if (navigator.vibrate) navigator.vibrate(100);

  setTimeout(()=>{
    btn.innerText = "Copiar tarjeta";
  },1500);
}

function sendWhats(){
  const phone = "529982155292";
  const msg = "Hola, te envío mi comprobante de pago";
  window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, "_blank");
}
</script>

</body>
</html>
